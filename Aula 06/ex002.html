<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body{background-color: rgb(90, 99, 97);
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: brown;
        }
    </style>
</head>
<body>
    <h1>Olá mundo!</h1>
    <p>Já me livrei</p>
    <script>
        var nome = window.prompt("Qual é seu nome?"); // armazena o nome do usuário
        window.alert("É um grande prazer te conhecer " + nome + "!") // pergunta novamente o nome do usuário
    </script>
</body>
</html>
